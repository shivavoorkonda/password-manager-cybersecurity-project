<svg xmlns="http://www.w3.org/2000/svg" width="1622" height="940" viewBox="0 0 1622 940" role="img" aria-labelledby="title desc">
<title id="title">Secure Password Manager — System Architecture</title>
<desc id="desc">The browser vault calls a local Flask service for analysis. Flask sends only a five-character SHA-1 prefix to HIBP and compares returned suffixes locally. The Node and PostgreSQL scaffold is separate.</desc>
<defs>
  <marker id="arrow" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M1 1 L11 6 L1 11 z" fill="#526276"/></marker>
  <marker id="arrowL" markerWidth="12" markerHeight="12" refX="2" refY="6" orient="auto"><path d="M11 1 L1 6 L11 11 z" fill="#526276"/></marker>
  <style>text{font-family:Arial,Helvetica,sans-serif;fill:#102238}.title{font-size:38px;font-weight:700}.group{font-size:23px;font-weight:700}.head{font-size:22px;font-weight:700}.body{font-size:19px}.small{font-size:16px}</style>
</defs>
<rect width="1622" height="940" fill="#f8fafc"/>
<text class="title" x="811" y="64" text-anchor="middle">Secure Password Manager — System Architecture</text>
<rect x="76" y="110" width="1470" height="336" rx="22" fill="#f4f8ff" stroke="#2563eb" stroke-width="3"/>
<text class="group" x="118" y="157">Browser — React + TypeScript</text>

<!-- Optional request/response paths and HIBP range exchange -->
<path d="M 812 392 L 580 548" stroke="#526276" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M 680 548 L 870 392" stroke="#526276" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<text class="small" x="657" y="474" text-anchor="middle">password / result</text>
<path d="M 778 625 L 990 625" stroke="#526276" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M 990 690 L 778 690" stroke="#526276" stroke-width="3" fill="none" marker-end="url(#arrowL)"/>
<text class="small" x="884" y="610" text-anchor="middle" fill="#047857">prefix only</text>
<text class="small" x="884" y="718" text-anchor="middle" fill="#c2410c">suffixes</text>
<path d="M 518 290 L 615 290" stroke="#526276" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
<path d="M 1014 290 L 1114 290" stroke="#526276" stroke-width="3" fill="none" marker-end="url(#arrow)"/>

<rect x="118" y="190" width="400" height="202" rx="12" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
<text class="head" x="145" y="232">Encrypted local vault</text>
<text class="body" x="145" y="273">PBKDF2-HMAC-SHA256 (600,000)</text>
<text class="body" x="145" y="308">AES-256-GCM, fresh IV per entry</text>
<text class="body" x="145" y="343">Encrypted entries in localStorage</text>

<rect x="615" y="190" width="399" height="202" rx="12" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
<text class="head" x="642" y="232">Password interface</text>
<text class="body" x="642" y="273">Generator, search and categories</text>
<text class="body" x="642" y="308">Rule meter + zxcvbn in browser</text>
<text class="body" x="642" y="343">Optional loopback analysis request</text>

<rect x="1114" y="190" width="392" height="202" rx="12" fill="#ffffff" stroke="#60a5fa" stroke-width="2"/>
<text class="head" x="1140" y="232">Security feedback</text>
<text class="body" x="1140" y="273">ML verdict and confidence</text>
<text class="body" x="1140" y="308">Breach status and consensus</text>
<text class="body" x="1140" y="343">Recommendations when needed</text>

<rect x="210" y="548" width="568" height="236" rx="20" fill="#ecfdf5" stroke="#059669" stroke-width="3"/>
<text class="head" x="245" y="594" fill="#065f46">Local Flask service — 127.0.0.1:5000</text>
<text class="body" x="245" y="635">Receives password over loopback only</text>
<text class="body" x="245" y="672">Extracts 17 features → selected RF model</text>
<text class="body" x="245" y="709">Computes SHA-1; requests HIBP range</text>
<text class="small" x="245" y="750" fill="#475569">Returns verdict and recommendations; input not persisted</text>

<rect x="990" y="548" width="420" height="236" rx="20" fill="#fff7ed" stroke="#ea580c" stroke-width="3"/>
<text class="head" x="1025" y="594" fill="#9a3412">HIBP range API</text>
<text class="body" x="1025" y="635">Only first 5 hash characters leave device</text>
<text class="body" x="1025" y="672">Returns matching hash suffixes</text>
<text class="body" x="1025" y="709">Suffixes compared by Flask locally</text>
<text class="small" x="1025" y="750" fill="#475569">HIBP never receives the full password</text>

<rect x="346" y="840" width="930" height="64" rx="10" fill="#f8fafc" stroke="#64748b" stroke-width="3" stroke-dasharray="10 8"/>
<text class="head" x="811" y="881" text-anchor="middle" fill="#334155">Separate Node.js / PostgreSQL scaffold — not connected to the browser-vault flow</text>
</svg>
