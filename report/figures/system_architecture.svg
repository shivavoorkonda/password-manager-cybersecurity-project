<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Secure Password Manager System Architecture</title><desc id="desc">Browser-local encrypted vault, loopback Flask analysis service, HIBP prefix lookup, and a separate Node PostgreSQL scaffold.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker><style>.t{font:bold 28px Arial;fill:#0f172a}.h{font:bold 17px Arial;fill:#0f172a}.b{font:14px Arial;fill:#334155}.s{font:12px Arial;fill:#475569}.e{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1200" height="700" fill="#f8fafc"/><text x="600" y="45" text-anchor="middle" class="t">Secure Password Manager — System Architecture</text>
  <rect x="55" y="80" width="1090" height="250" rx="14" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/><text x="85" y="113" class="h">Browser — React + TypeScript</text>
  <rect x="85" y="140" width="295" height="150" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="2"/><text x="105" y="172" class="h">Encrypted local vault</text><text x="105" y="202" class="b">PBKDF2-HMAC-SHA256 (600,000)</text><text x="105" y="227" class="b">AES-256-GCM, fresh IV per entry</text><text x="105" y="252" class="b">Encrypted entries in localStorage</text>
  <rect x="455" y="140" width="295" height="150" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="2"/><text x="475" y="172" class="h">Password interface</text><text x="475" y="202" class="b">Generator, search and categories</text><text x="475" y="227" class="b">Rule meter + zxcvbn in browser</text><text x="475" y="252" class="b">Optional loopback analysis request</text>
  <rect x="825" y="140" width="290" height="150" rx="8" fill="#fff" stroke="#60a5fa" stroke-width="2"/><text x="845" y="172" class="h">Security feedback</text><text x="845" y="202" class="b">ML verdict and confidence</text><text x="845" y="227" class="b">Breach status and consensus</text><text x="845" y="252" class="b">Recommendations when needed</text>
  <path d="M380 215H455M750 215H825" class="e"/>
  <rect x="155" y="410" width="420" height="175" rx="14" fill="#ecfdf5" stroke="#059669" stroke-width="2"/><text x="180" y="445" class="h">Local Flask service — 127.0.0.1:5000</text><text x="180" y="475" class="b">Receives optional password over loopback only</text><text x="180" y="500" class="b">Extracts 17 features → selected ML model</text><text x="180" y="525" class="b">Returns ML result, consensus and recommendations</text><text x="180" y="555" class="s">Passwords are not logged or persisted by this API</text>
  <rect x="735" y="410" width="310" height="175" rx="14" fill="#fff7ed" stroke="#ea580c" stroke-width="2"/><text x="760" y="445" class="h">HIBP range API</text><text x="760" y="475" class="b">Flask computes SHA-1 locally</text><text x="760" y="500" class="b">Only five hash characters leave device</text><text x="760" y="525" class="b">Suffixes return for local comparison</text><text x="760" y="555" class="s">HIBP never receives the full password</text>
  <path d="M600 290L430 410M575 497H735M735 445L670 290" class="e"/><text x="650" y="484" text-anchor="middle" class="s">prefix only</text>
  <rect x="255" y="625" width="690" height="45" rx="8" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="7 5"/><text x="600" y="653" text-anchor="middle" class="h">Separate Node.js / PostgreSQL scaffold — not connected to the browser-vault flow</text>
</svg>
