<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Simple Secure Password Manager Architecture</title>
  <desc id="desc">The local browser vault requests optional analysis from a loopback Flask service. Only a SHA-1 prefix is sent to HIBP.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0 L0 8 L10 4 z" fill="#35565b"/></marker>
    <style>.title{font:bold 30px Arial;fill:#173b3f}.h{font:bold 20px Arial;fill:#173b3f}.b{font:16px Arial;fill:#34454a}.s{font:14px Arial;fill:#526d70}.edge{stroke:#35565b;stroke-width:3;fill:none;marker-end:url(#arrow)}.external{stroke:#c96d32;stroke-width:3;stroke-dasharray:8 6;fill:none;marker-end:url(#arrow)}</style>
  </defs>
  <rect width="1200" height="620" fill="#fbfcfb"/>
  <text x="600" y="48" text-anchor="middle" class="title">Secure Password Manager - Simplified Architecture</text>
  <text x="600" y="75" text-anchor="middle" class="s">Local vault and analysis with privacy-preserving breach lookup</text>

  <rect x="50" y="125" width="320" height="310" rx="18" fill="#eef6f4" stroke="#2f6f6d" stroke-width="3"/>
  <text x="78" y="165" class="h">1. Browser vault</text>
  <text x="78" y="205" class="b">Encrypted local credentials</text>
  <text x="78" y="235" class="b">AES-256-GCM + PBKDF2</text>
  <text x="78" y="265" class="b">Rule meter + zxcvbn</text>
  <text x="78" y="295" class="b">Generator and auto-lock</text>
  <text x="78" y="350" class="s">Password remains on the device</text>

  <rect x="440" y="125" width="320" height="310" rx="18" fill="#f1faf6" stroke="#1f7a68" stroke-width="3"/>
  <text x="468" y="165" class="h">2. Local analysis</text>
  <text x="468" y="205" class="b">Flask at 127.0.0.1:5000</text>
  <text x="468" y="235" class="b">17 features -> Random Forest</text>
  <text x="468" y="265" class="b">Consensus and suggestions</text>
  <text x="468" y="295" class="b">No password logging</text>
  <text x="468" y="350" class="s">Loopback only; not network exposed</text>

  <rect x="830" y="125" width="320" height="310" rx="18" fill="#fff6ed" stroke="#c96d32" stroke-width="3"/>
  <text x="858" y="165" class="h">3. HIBP check</text>
  <text x="858" y="205" class="b">SHA-1 calculated locally</text>
  <text x="858" y="235" class="b">Only first 5 hash characters</text>
  <text x="858" y="265" class="b">sent to the range API</text>
  <text x="858" y="295" class="b">Suffixes matched locally</text>
  <text x="858" y="350" class="s">Full password never reaches HIBP</text>

  <path d="M370 240 H440" class="edge"/><text x="405" y="220" text-anchor="middle" class="s">optional analysis</text>
  <path d="M440 320 H370" class="edge"/><text x="405" y="347" text-anchor="middle" class="s">verdict + advice</text>
  <path d="M760 250 H830" class="external"/><text x="795" y="230" text-anchor="middle" class="s">SHA-1 prefix only</text>
  <rect x="210" y="500" width="780" height="55" rx="10" fill="#e4efec"/>
  <text x="600" y="523" text-anchor="middle" class="h">Privacy boundary</text>
  <text x="600" y="546" text-anchor="middle" class="b">The complete password remains on the user device.</text>
</svg>
