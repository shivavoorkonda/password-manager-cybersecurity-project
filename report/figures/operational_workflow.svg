<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Secure Password Manager Operational Workflow</title><desc id="desc">Unlock, local encryption, optional strength analysis, HIBP prefix lookup, and feedback workflow.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0 0L0 6L9 3z" fill="#475569"/></marker><style>.t{font:bold 27px Arial;fill:#0f172a}.h{font:bold 15px Arial;fill:#0f172a}.b{font:13px Arial;fill:#334155}.e{stroke:#475569;stroke-width:2.5;fill:none;marker-end:url(#a)}.n{font:bold 13px Arial;fill:#fff}</style></defs>
  <rect width="1200" height="620" fill="#f8fafc"/><text x="600" y="45" text-anchor="middle" class="t">Operational Workflow</text>
  <path d="M180 120H330M500 120H650M820 120H970M970 300H820M650 300H500M330 300H180M180 480H330M500 480H650" class="e"/>
  <g><rect x="35" y="85" width="145" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><circle cx="58" cy="108" r="13" fill="#2563eb"/><text x="58" y="113" text-anchor="middle" class="n">1</text><text x="107" y="115" text-anchor="middle" class="h">Unlock vault</text><text x="107" y="136" text-anchor="middle" class="b">master password</text></g>
  <g><rect x="330" y="85" width="170" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><circle cx="353" cy="108" r="13" fill="#2563eb"/><text x="353" y="113" text-anchor="middle" class="n">2</text><text x="415" y="115" text-anchor="middle" class="h">Derive key</text><text x="415" y="136" text-anchor="middle" class="b">decrypt browser vault</text></g>
  <g><rect x="650" y="85" width="170" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><circle cx="673" cy="108" r="13" fill="#2563eb"/><text x="673" y="113" text-anchor="middle" class="n">3</text><text x="735" y="115" text-anchor="middle" class="h">Enter password</text><text x="735" y="136" text-anchor="middle" class="b">or use generator</text></g>
  <g><rect x="970" y="85" width="195" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><circle cx="993" cy="108" r="13" fill="#2563eb"/><text x="993" y="113" text-anchor="middle" class="n">4</text><text x="1067" y="115" text-anchor="middle" class="h">Browser feedback</text><text x="1067" y="136" text-anchor="middle" class="b">rule meter and zxcvbn</text></g>
  <g><rect x="970" y="265" width="195" height="70" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/><circle cx="993" cy="288" r="13" fill="#059669"/><text x="993" y="293" text-anchor="middle" class="n">5</text><text x="1067" y="295" text-anchor="middle" class="h">Loopback request</text><text x="1067" y="316" text-anchor="middle" class="b">browser → Flask</text></g>
  <g><rect x="650" y="265" width="170" height="70" rx="10" fill="#d1fae5" stroke="#059669" stroke-width="2"/><circle cx="673" cy="288" r="13" fill="#059669"/><text x="673" y="293" text-anchor="middle" class="n">6</text><text x="735" y="295" text-anchor="middle" class="h">ML analysis</text><text x="735" y="316" text-anchor="middle" class="b">17 features → prediction</text></g>
  <g><rect x="330" y="265" width="170" height="70" rx="10" fill="#ffedd5" stroke="#ea580c" stroke-width="2"/><circle cx="353" cy="288" r="13" fill="#ea580c"/><text x="353" y="293" text-anchor="middle" class="n">7</text><text x="415" y="295" text-anchor="middle" class="h">HIBP range check</text><text x="415" y="316" text-anchor="middle" class="b">five SHA-1 chars only</text></g>
  <g><rect x="35" y="265" width="145" height="70" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/><circle cx="58" cy="288" r="13" fill="#2563eb"/><text x="58" y="293" text-anchor="middle" class="n">8</text><text x="107" y="295" text-anchor="middle" class="h">Return results</text><text x="107" y="316" text-anchor="middle" class="b">consensus + breach</text></g>
